<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>الملف الشخصي</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary: __PRIMARY__;
      --secondary: __SECONDARY__;
      --bg: var(--tg-theme-bg-color, #f5f7fb);
      --card: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #102a43);
      --muted: var(--tg-theme-hint-color, #64748b);
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .page { max-width: 680px; margin: 0 auto; padding: 18px 14px calc(28px + env(safe-area-inset-bottom)); }
    .hero { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border-radius: 22px; padding: 20px; box-shadow: 0 12px 32px rgba(15, 43, 82, .18); }
    .hero h1 { margin: 0 0 7px; font-size: 23px; }
    .hero p { margin: 0; opacity: .92; line-height: 1.6; }
    form { margin-top: 14px; background: var(--card); border-radius: 22px; padding: 17px; box-shadow: 0 8px 24px rgba(15, 43, 82, .08); }
    .grid { display: grid; gap: 13px; }
    @media (min-width: 560px) { .grid.two { grid-template-columns: 1fr 1fr; } }
    label { display: block; font-size: 13px; font-weight: 700; margin: 0 3px 6px; }
    input { width: 100%; min-height: 48px; border: 1px solid rgba(100, 116, 139, .25); border-radius: 14px; padding: 11px 13px; background: var(--bg); color: var(--text); font: inherit; outline: none; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
    button { width: 100%; min-height: 52px; border: 0; border-radius: 15px; margin-top: 16px; background: var(--primary); color: white; font: inherit; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .58; cursor: wait; }
    .notice { min-height: 23px; margin-top: 12px; text-align: center; font-size: 14px; color: var(--muted); }
    .notice.error { color: var(--danger); }
    .security { margin-top: 12px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>🪪 معلومات الطالب</h1>
      <p>أكمل بياناتك مرة واحدة لتسريع الطلبات والتفعيل والدعم داخل __BOT_NAME__.</p>
    </section>
    <form id="profile-form" autocomplete="on">
      <div class="grid two">
        <div><label for="full_name">الاسم الكامل</label><input id="full_name" name="full_name" minlength="5" maxlength="180" required></div>
        <div><label for="phone">رقم الهاتف</label><input id="phone" name="phone" inputmode="tel" minlength="10" maxlength="20" required></div>
        <div><label for="governorate">المحافظة</label><input id="governorate" name="governorate" maxlength="80" required></div>
        <div><label for="university">الجامعة</label><input id="university" name="university" maxlength="180" required></div>
        <div><label for="college">الكلية أو المعهد</label><input id="college" name="college" maxlength="180" required></div>
        <div><label for="department">القسم</label><input id="department" name="department" maxlength="180" required></div>
        <div><label for="stage">المرحلة</label><input id="stage" name="stage" maxlength="80" required></div>
      </div>
      <button id="save" type="submit">حفظ المعلومات</button>
      <div id="notice" class="notice">جاري التحقق من حساب Telegram…</div>
      <div class="security">🔐 يتم التحقق من هويتك بتوقيع Telegram. لا يمكن لمستخدم آخر تعديل ملفك عبر تغيير رقم الحساب.</div>
    </form>
  </main>
<script>
(() => {
  const tg = window.Telegram?.WebApp;
  const form = document.getElementById('profile-form');
  const notice = document.getElementById('notice');
  const save = document.getElementById('save');
  const initData = tg?.initData || '';
  const headers = {'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData};
  const setNotice = (text, error=false) => { notice.textContent = text; notice.className = error ? 'notice error' : 'notice'; };
  const fields = ['full_name','phone','governorate','university','college','department','stage'];
  tg?.ready(); tg?.expand();
  if (!initData) { setNotice('افتح هذه الصفحة من الزر داخل البوت.', true); save.disabled = true; return; }
  fetch('/api/webapp/student/profile', {headers: {'X-Telegram-Init-Data': initData}, cache: 'no-store'})
    .then(async r => { const data = await r.json(); if (!r.ok) throw new Error(data.detail || 'تعذر قراءة الملف'); return data; })
    .then(data => { fields.forEach(k => { document.getElementById(k).value = data.profile?.[k] || ''; }); setNotice(data.complete ? 'يمكنك تعديل معلوماتك ثم الحفظ.' : 'أكمل جميع الحقول المطلوبة.'); })
    .catch(e => { setNotice(e.message, true); save.disabled = true; });
  form.addEventListener('submit', async (event) => {
    event.preventDefault(); save.disabled = true; setNotice('⏳ جاري حفظ المعلومات…');
    const payload = Object.fromEntries(fields.map(k => [k, document.getElementById(k).value.trim()]));
    try {
      const r = await fetch('/api/webapp/student/profile', {method:'PUT', headers, body: JSON.stringify(payload)});
      const data = await r.json(); if (!r.ok) throw new Error(data.detail || 'تعذر الحفظ');
      setNotice('✅ تم حفظ معلوماتك بنجاح.'); tg?.HapticFeedback?.notificationOccurred('success');
      setTimeout(() => tg?.close(), 650);
    } catch (e) { setNotice(e.message, true); save.disabled = false; tg?.HapticFeedback?.notificationOccurred('error'); }
  });
})();
</script>
</body>
</html>
