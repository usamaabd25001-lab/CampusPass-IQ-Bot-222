name: CampusPass CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campuspass
          POSTGRES_PASSWORD: campuspass
          POSTGRES_DB: campuspass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campuspass -d campuspass_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BOT_TOKEN: "123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      ADMIN_IDS: "123456789"
      DATABASE_URL: postgresql+asyncpg://campuspass:campuspass@127.0.0.1:5432/campuspass_test
      DB_SSL_MODE: disable
      REDIS_URL: redis://127.0.0.1:6379/0
      ENCRYPTION_KEY: "QmFzZTY0RmVybmV0S2V5Rm9yVGVzdE9ubHkxMjM0NTY3ODkwMTI="
      ENVIRONMENT: test
      REQUIRE_EXTERNAL_DATABASE: "false"
      FEATURE_PROVIDER_WITHDRAWALS: "false"
      MONEY_FLOW_MODEL: provider_direct_prepaid_commission
      RELEASE_ID: ci-v69
      RUNTIME_MODE: combined
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pytest-asyncio ruff
      - run: ruff check app tests scripts ops alembic --select E9,F63,F7,F82
      - run: python scripts/verify_runtime_files.py
      - run: python scripts/verify_project.py
      - run: python scripts/verify_phase3.py
      - run: python scripts/verify_phase4.py
      - run: python scripts/verify_phase5.py
      - run: python scripts/validate_v11_6_render_e2e.py
      - run: python -m compileall -q app tests scripts ops alembic
      - run: pytest -q
