# CampusPass IQ V11.7.3 - Render Free Tier
# One free web service runs both Telegram webhook handling and scheduled worker tasks.
# No paid background worker, no paid pre-deploy command, and Redis is optional.
services:
  - type: web
    name: campuspass-iq-free
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RUNTIME_MODE
        value: combined
      - key: TELEGRAM_DELIVERY_MODE
        value: webhook
      - key: TELEGRAM_WEBHOOK_PATH
        value: /telegram/webhook
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: API_ADMIN_TOKEN
        sync: false
      - key: METRICS_TOKEN
        sync: false

      # Free-tier compatibility: the app falls back to in-memory FSM/cache.
      - key: REQUIRE_EXTERNAL_DATABASE
        value: "true"
      - key: REQUIRE_REDIS_IN_PRODUCTION
        value: "false"
      - key: DEPLOYMENT_GATE_STRICT
        value: "false"
      - key: REQUIRE_FRESH_WORKER_HEARTBEAT
        value: "false"

      # Supabase / pooled PostgreSQL compatibility.
      - key: DB_SSL_MODE
        value: require
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_TIMEOUT_SECONDS
        value: "15"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "600"
      - key: DB_PREPARED_STATEMENT_CACHE_SIZE
        value: "0"

      # Conservative limits for a 512 MB free web instance.
      - key: TELEGRAM_WEBHOOK_MAX_CONNECTIONS
        value: "20"
      - key: TELEGRAM_UPDATE_CONSUMERS
        value: "2"
      - key: TELEGRAM_UPDATE_CLAIM_BATCH_SIZE
        value: "2"
      - key: TELEGRAM_HTTP_CONNECTION_LIMIT
        value: "20"
      - key: BOT_UPDATE_CONCURRENCY
        value: "20"
      - key: UVICORN_LIMIT_CONCURRENCY
        value: "100"
      - key: UVICORN_BACKLOG
        value: "256"
      - key: UVICORN_TIMEOUT_KEEP_ALIVE
        value: "10"

      - key: TIMEZONE
        value: Asia/Baghdad
      - key: FEATURE_GEMINI
        value: "true"
      - key: FEATURE_MASTERCARD
        value: "false"
      - key: FEATURE_PROVIDER_WITHDRAWALS
        value: "false"
      - key: MONEY_FLOW_MODEL
        value: provider_direct_prepaid_commission
      - key: BACKUP_ENABLED
        value: "true"
      - key: IMAGE_MODERATION_ENABLED
        value: "true"
      - key: IMAGE_MODERATION_PROVIDER
        value: auto
      - key: IMAGE_MODERATION_FAIL_CLOSED
        value: "false"
      - key: EVIDENCE_EXTERNAL_STORAGE_ENABLED
        value: "true"
      - key: FEATURE_DISPUTES
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: BRAND_PRIMARY_COLOR
        value: "#003279"
      - key: BRAND_SECONDARY_COLOR
        value: "#14A5A2"
      - key: BRAND_DARK_COLOR
        value: "#082F63"
