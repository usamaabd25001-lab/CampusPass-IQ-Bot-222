# ============================================================
# CampusPass IQ V11.7.4
# Render Free Tier - Frankfurt, Germany
# Optimized for Telegram + PostgreSQL/Supabase + Gemini
# ============================================================

services:
  - type: web
    name: campuspass-iq-free

    # Germany - Frankfurt
    region: frankfurt

    runtime: docker
    plan: free

    dockerfilePath: ./Dockerfile

    # Health monitoring
    healthCheckPath: /health/live

    # Deploy automatically after every commit
    autoDeployTrigger: commit

    envVars:

      # ========================================================
      # CORE
      # ========================================================

      - key: ENVIRONMENT
        value: production

      - key: RUNTIME_MODE
        value: combined

      - key: TIMEZONE
        value: Asia/Baghdad

      - key: LOG_LEVEL
        value: INFO


      # ========================================================
      # TELEGRAM
      # ========================================================

      - key: TELEGRAM_DELIVERY_MODE
        value: webhook

      - key: TELEGRAM_WEBHOOK_PATH
        value: /telegram/webhook

      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

      - key: BOT_TOKEN
        sync: false

      - key: ADMIN_IDS
        sync: false


      # ========================================================
      # SECURITY / APPLICATION SECRETS
      # ========================================================

      - key: ENCRYPTION_KEY
        sync: false

      - key: API_ADMIN_TOKEN
        sync: false

      - key: METRICS_TOKEN
        sync: false


      # ========================================================
      # DATABASE
      # ========================================================

      - key: DATABASE_URL
        sync: false

      - key: REQUIRE_EXTERNAL_DATABASE
        value: "true"

      - key: DB_SSL_MODE
        value: require

      # Balanced for Render Free 512 MB / 0.1 CPU.
      # Bigger is NOT automatically faster on the free instance.
      - key: DB_POOL_SIZE
        value: "8"

      - key: DB_MAX_OVERFLOW
        value: "4"

      - key: DB_POOL_TIMEOUT_SECONDS
        value: "30"

      - key: DB_POOL_RECYCLE_SECONDS
        value: "600"

      # Good choice when using pooled PostgreSQL / Supabase pooler
      - key: DB_PREPARED_STATEMENT_CACHE_SIZE
        value: "0"


      # ========================================================
      # REDIS / CACHE
      # ========================================================

      # Redis remains optional.
      # Application can use in-memory FSM/cache fallback.
      - key: REQUIRE_REDIS_IN_PRODUCTION
        value: "false"

      - key: DEPLOYMENT_GATE_STRICT
        value: "false"

      - key: REQUIRE_FRESH_WORKER_HEARTBEAT
        value: "false"


      # ========================================================
      # TELEGRAM PERFORMANCE
      # ========================================================

      - key: TELEGRAM_WEBHOOK_MAX_CONNECTIONS
        value: "20"

      - key: TELEGRAM_UPDATE_CONSUMERS
        value: "2"

      - key: TELEGRAM_UPDATE_CLAIM_BATCH_SIZE
        value: "2"

      - key: TELEGRAM_HTTP_CONNECTION_LIMIT
        value: "16"

      # Enough parallelism without overwhelming Render Free CPU
      - key: BOT_UPDATE_CONCURRENCY
        value: "12"


      # ========================================================
      # UVICORN PERFORMANCE
      # ========================================================

      - key: UVICORN_LIMIT_CONCURRENCY
        value: "50"

      - key: UVICORN_BACKLOG
        value: "128"

      - key: UVICORN_TIMEOUT_KEEP_ALIVE
        value: "5"


      # ========================================================
      # GEMINI AI
      # ========================================================

      - key: FEATURE_GEMINI
        value: "true"

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.6-flash

      - key: GEMINI_TIMEOUT_SECONDS
        value: "45"

      - key: GEMINI_DAILY_USER_LIMIT
        value: "20"

      - key: GEMINI_MAX_PENDING_PER_USER
        value: "2"

      - key: GEMINI_RETRY_ATTEMPTS
        value: "3"

      - key: GEMINI_JOB_MAX_ATTEMPTS
        value: "3"

      - key: GEMINI_JOB_RETENTION_DAYS
        value: "14"

      - key: GEMINI_CIRCUIT_FAILURE_THRESHOLD
        value: "5"

      - key: GEMINI_CIRCUIT_RESET_SECONDS
        value: "60"

      - key: GEMINI_CACHE_TTL_SECONDS
        value: "300"

      - key: GEMINI_CACHE_MAX_ENTRIES
        value: "200"

      # Gemini calls are expensive relative to Render Free CPU.
      # Two simultaneous jobs is a safer balance.
      - key: AI_CONCURRENCY_LIMIT
        value: "2"


      # ========================================================
      # PAYMENT / MONEY FLOW
      # ========================================================

      - key: FEATURE_MASTERCARD
        value: "false"

      - key: FEATURE_PROVIDER_WITHDRAWALS
        value: "false"

      - key: MONEY_FLOW_MODEL
        value: provider_direct_prepaid_commission


      # ========================================================
      # BACKUPS
      # ========================================================

      - key: BACKUP_ENABLED
        value: "false"

      - key: BACKUP_STORAGE_BACKEND
        value: disabled

      - key: AUTO_PRE_DEPLOY_BACKUP
        value: "false"

      - key: REQUIRE_PRE_DEPLOY_BACKUP
        value: "false"


      # ========================================================
      # IMAGE MODERATION
      # ========================================================

      - key: IMAGE_MODERATION_ENABLED
        value: "true"

      - key: IMAGE_MODERATION_PROVIDER
        value: auto

      - key: IMAGE_MODERATION_FAIL_CLOSED
        value: "false"


      # ========================================================
      # EVIDENCE STORAGE
      # ========================================================

      - key: EVIDENCE_EXTERNAL_STORAGE_ENABLED
        value: "false"

      - key: REQUIRE_EXTERNAL_EVIDENCE_STORAGE_IN_PRODUCTION
        value: "false"


      # ========================================================
      # FEATURES
      # ========================================================

      - key: FEATURE_DISPUTES
        value: "false"


      # ========================================================
      # BRAND
      # ========================================================

      - key: BRAND_PRIMARY_COLOR
        value: "#003279"

      - key: BRAND_SECONDARY_COLOR
        value: "#14A5A2"

      - key: BRAND_DARK_COLOR
        value: "#082F63"
