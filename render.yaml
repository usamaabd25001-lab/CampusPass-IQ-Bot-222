# V11.7 staging blueprint: one combined service for end-to-end validation.
services:
  - type: web
    name: campuspass-v11-7-staging
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    preDeployCommand: python ops/render_predeploy.py
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: RUNTIME_MODE
        value: combined
      - key: TELEGRAM_DELIVERY_MODE
        value: webhook
      - key: TELEGRAM_WEBHOOK_PATH
        value: /telegram/webhook
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_MAX_CONNECTIONS
        value: "60"
      - key: TELEGRAM_UPDATE_CONSUMERS
        value: "10"
      - key: TELEGRAM_UPDATE_CLAIM_BATCH_SIZE
        value: "4"
      - key: TELEGRAM_UPDATE_IDLE_WAIT_MS
        value: "50"
      - key: TELEGRAM_UPDATE_GRACEFUL_SHUTDOWN_SECONDS
        value: "30"
      - key: CACHE_GENERATION_POLL_SECONDS
        value: "1"
      - key: UPDATE_MIN_COMPATIBLE_VERSION
        value: 11.6.0-render-e2e-hardening
      - key: UPDATE_MIN_COMPATIBLE_SCHEMA
        value: 11.6.0-render-e2e-hardening
      - key: UPDATE_CALLBACK_SCHEMA_VERSION
        value: "1"
      - key: UPDATE_EVENT_SCHEMA_VERSION
        value: "1"
      - key: UPDATE_ROLLOUT_PERCENT
        value: "100"
      - key: UPDATE_REQUIRE_EXPAND_CONTRACT
        value: "true"
      - key: UVICORN_LIMIT_CONCURRENCY
        value: "1000"
      - key: UVICORN_BACKLOG
        value: "2048"
      - key: UVICORN_TIMEOUT_KEEP_ALIVE
        value: "10"
      - key: TELEGRAM_UPDATE_MAX_ATTEMPTS
        value: "8"
      - key: TELEGRAM_UPDATE_RETENTION_DAYS
        value: "14"
      - key: DEPLOYMENT_GATE_STRICT
        value: "true"
      - key: DEPLOYMENT_GATE_WAIT_SECONDS
        value: "120"
      - key: REQUIRE_FRESH_WORKER_HEARTBEAT
        value: "true"
      - key: TIMEZONE
        value: Asia/Baghdad
      - key: BOT_TOKEN
        sync: false
      - key: STAGING_BOT_TOKEN_FINGERPRINT
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: API_ADMIN_TOKEN
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: REQUIRE_EXTERNAL_DATABASE
        value: "true"
      - key: REQUIRE_REDIS_IN_PRODUCTION
        value: "true"
      - key: DB_SSL_MODE
        value: require
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_POOL_TIMEOUT_SECONDS
        value: "15"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "900"
      - key: DB_PREPARED_STATEMENT_CACHE_SIZE
        value: "0"
      - key: RATE_LIMIT_INTERVAL_MS
        value: "350"
      - key: DUPLICATE_ACTION_WINDOW_MS
        value: "1500"
      - key: SENSITIVE_ACTION_COOLDOWN_MS
        value: "2000"
      - key: PROCESSING_INDICATOR_DELAY_MS
        value: "120"
      - key: PROCESSING_MESSAGE_TEXT
        value: "⏳ يرجى الانتظار..."
      - key: FEATURE_GEMINI
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: FEATURE_MASTERCARD
        value: "true"
      - key: FEATURE_PROVIDER_WITHDRAWALS
        value: "true"
      - key: MONEY_FLOW_MODEL
        value: gateway_marketplace
      - key: BACKUP_ENABLED
        value: "true"
      - key: IMAGE_MODERATION_ENABLED
        value: "true"
      - key: IMAGE_MODERATION_PROVIDER
        value: auto
      - key: IMAGE_MODERATION_FAIL_CLOSED
        value: "false"
      - key: EVIDENCE_EXTERNAL_STORAGE_ENABLED
        value: "true"
      - key: FEATURE_DISPUTES
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: BRAND_PRIMARY_COLOR
        value: "#003279"
      - key: BRAND_SECONDARY_COLOR
        value: "#14A5A2"
      - key: BRAND_DARK_COLOR
        value: "#082F63"
